# golangci-lint v2 configuration.
# Docs: https://golangci-lint.run/usage/configuration/
version: "2"

run:
  timeout: 5m
  # The module targets Go 1.23; pin analysis to it.
  go: "1.23"

linters:
  # The default set (errcheck, govet, ineffassign, staticcheck, unused) is
  # kept; these add value for a network service that handles untrusted input.
  enable:
    - gosec      # security: file perms, TLS, command exec, etc.
    - bodyclose  # http.Response.Body must be closed
    - noctx      # http/net operations should carry a context
    - unconvert  # remove unnecessary type conversions
    - unparam    # unused function parameters
    - gocritic   # code style & quality checks
    - prealloc   # hint slice pre-allocation
    - revive     # configurable style linter (revives golint + staticcheck style)

  settings:
    gosec:
      excludes:
        # G104 (unchecked error) overlaps with errcheck, which is the linter
        # we rely on for that; keep errcheck's more precise reporting.
        - G104
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
      disabled-checks:
        # These functions take value types intentionally (snapshot semantics,
        # e.g. store.Set copies the status before storing); the copies are
        # cheap struct headers, not large buffers.
        - hugeParam

  exclusions:
    rules:
      # Test helpers build requests/listeners without contexts on purpose;
      # the noctx and gosec rules add noise there without catching real bugs.
      - path: _test\.go
        linters:
          - noctx
          - gosec

formatters:
  enable:
    - gofmt
    - gofumpt
